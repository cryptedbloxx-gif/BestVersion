<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* NAVBAR */
nav {
    display: flex;
    gap: 20px;
    padding: 15px;
    background: #111827;
    align-items: center;
}

nav a {
    color: #9ca3af;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    transition: 0.2s;
}

nav a.active,
nav a:hover {
    background: #2563eb;
    color: white;
}

/* PROFILE BUTTON */
.profileBtn {
    position: absolute;
    right: 20px;
    top: 12px;
    padding: 8px 12px;
    border: none;
    border-radius: 10px;
    background: #1f2937;
    color: white;
    cursor: pointer;
}

.profileBtn:hover {
    background: #374151;
}

/* HABIT CARD */
.habit {
    margin: 30px;
    padding: 15px;
    background: #1e293b;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
}

input[type="checkbox"] {
    transform: scale(1.3);
}
</style>
</head>

<body>

<nav>
    <a href="#" class="active">🏠 Dashboard</a>
    <a href="#">✅ Habits</a>
    <a href="#">📈 Progress</a>
    <a href="#">🏆 Achievements</a>
    <a href="#">⚙ Settings</a>
</nav>

<button class="profileBtn">
👤 Profile
</button>

<div class="habit">
    <input type="checkbox">
    Workout
</div>

</body>
</html>
