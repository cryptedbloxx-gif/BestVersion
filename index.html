<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BestVersion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="particles"></canvas>

<div class="app">

    <aside class="sidebar">

        <div class="brand">

            <img src="logo.svg" class="logo">

            <div>

                <h2>BestVersion</h2>
                <p>Level Up Life</p>

            </div>

        </div>

        <nav>

            <a href="#" class="active">🏠 Dashboard</a>
            <a href="#">✅ Habits</a>
            <a href="#">📈 Progress</a>
            <a href="#">🏆 Achievements</a>
            <a href="#">⚙ Settings</a>

        </nav>

    </aside>

    <main>

        <div class="topbar">

            <h1>Welcome Back</h1>

            <button class="profileBtn">
                👤 Profile
            </button>

        </div>

        <div class="cards">

            <div class="card">

                <h3>XP</h3>

                <h2>720</h2>

                <p>+35 Today</p>

            </div>

            <div class="card">

                <h3>Level</h3>

                <h2>7</h2>

                <p>Next Level Soon</p>

            </div>

            <div class="card">

                <h3>Streak</h3>

                <h2>18 🔥</h2>

                <p>Keep Going</p>

            </div>

        </div>

        <div class="dashboard">

            <div class="habitsPanel">

                <h2>Today's Habits</h2>

                <div class="habit">
                    <input type="checkbox">
                    Workout
                </div>

                <div class="habit">
                    <input type="checkbox">
                    Drink 3L Water
                </div>

                <div class="habit">
                    <input type="checkbox">
                    Read 10 Pages
                </div>

            </div>

            <div class="achievementPanel">

                <h2>Achievements</h2>

                <div class="achievement">
                    🏆 7 Day Streak
                </div>

                <div class="achievement">
                    ⚡ First Level Up
                </div>

                <div class="achievement">
                    💪 Consistency Beast
                </div>

            </div>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>
